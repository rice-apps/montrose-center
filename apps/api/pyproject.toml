[project]
name = "montrose-center-api"
version = "0.1.0"
description = "First sprint chat API with fictional resource data."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-ai-slim[openai]>=1,<2",
  "supabase>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
